[package]
name = "vision-stream"
version = "0.1.0"
description = "VISION STREAM desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vision_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.36.1"
nvml-wrapper = "0.13.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
