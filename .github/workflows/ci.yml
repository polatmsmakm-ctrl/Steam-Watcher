name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Server, web client and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium, Xvfb and coturn for the end-to-end run
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb coturn
          sudo systemctl stop coturn || true
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/results/*.json
            e2e/results/*.png
            e2e/results/*.log

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # attach the installer to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Only the desktop app's dependencies: the server (mediasoup) is not needed to build the installer.
      - run: npm ci --workspace app
      - name: Build NSIS installer
        run: npm run tauri --workspace app -- build
      - uses: actions/upload-artifact@v4
        with:
          name: vision-stream-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
